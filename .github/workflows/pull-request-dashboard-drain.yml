name: Pull request dashboard queue drain

on:
  workflow_dispatch:
    inputs:
      dispatcher_generation:
        description: Netlify queue dispatcher generation.
        required: true
        type: string

permissions: {}

# One checkout serves every claimed repository, so the drain always runs the
# dashboard scripts from this repository's default branch. Stable repositories
# enter the queue only while that code and the promoted release advertise the
# same delivery versions.
concurrency:
  group: pull-request-dashboard-queue-drain
  cancel-in-progress: false

jobs:
  drain:
    if: github.repository == 'open-telemetry/shared-workflows'
    permissions:
      contents: write
      copilot-requests: write
      id-token: write
    environment: protected
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DISPATCHER_GENERATION: ${{ inputs.dispatcher_generation }}
      PR_DASHBOARD_QUEUE_ENDPOINT: https://otel-pull-request-dashboard.netlify.app/.netlify/functions/dashboard-queue-worker
      WORKER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CANARY_REPOSITORIES: '["opentelemetry-java-instrumentation", "shared-workflows"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve queue rollout mode
        run: |
          set -euo pipefail
          queue_mode=canary
          mapfile -t stable_refs < <(
            sed -nE \
              's#^[[:space:]]*uses: open-telemetry/shared-workflows/\.github/workflows/pull-request-dashboard-repo\.yml@([0-9a-f]{40}).*$#\1#p' \
              .github/workflows/pull-request-dashboard.yml |
              sort -u
          )
          if [[ "${#stable_refs[@]}" -gt 1 ]]; then
            echo "::error::Stable dashboard jobs use different workflow refs"
            exit 1
          fi
          if [[ "${#stable_refs[@]}" -eq 1 ]]; then
            stable_ref="${stable_refs[0]}"
            if git fetch --no-tags --depth=1 origin "$stable_ref" &&
              stable_workflow=$(git show "$stable_ref:.github/workflows/pull-request-dashboard-repo.yml"); then
              stable_queue_ready=true
              for requirement in acquire-publisher-lock release-publisher-lock "timeout-minutes: 50"; do
                if ! grep -Fq -- "$requirement" <<< "$stable_workflow"; then
                  echo "::notice::Stable dashboard workflow $stable_ref lacks $requirement; using canary queue mode"
                  stable_queue_ready=false
                fi
              done
              if [[ "$stable_queue_ready" == "true" ]]; then
                stable_state="$RUNNER_TEMP/stable-dashboard-state.py"
                if git show "$stable_ref:.github/scripts/pull-request-dashboard/state.py" > "$stable_state"; then
                  if resolved_queue_mode=$(python3 .github/scripts/pull-request-dashboard/queue_rollout.py \
                    --current-state .github/scripts/pull-request-dashboard/state.py \
                    --stable-state "$stable_state"); then
                    queue_mode="$resolved_queue_mode"
                  else
                    echo "::warning::Could not compare dashboard delivery versions; using canary queue mode"
                  fi
                else
                  echo "::warning::Promoted dashboard state code is unavailable; using canary queue mode"
                fi
              fi
            else
              echo "::warning::Promoted dashboard workflow is unavailable; using canary queue mode"
            fi
          fi
          echo "DASHBOARD_QUEUE_MODE=$queue_mode" >> "$GITHUB_ENV"
          echo "Pull request dashboard queue mode: $queue_mode"

      - name: Activate queue dispatcher
        id: activate
        run: |
          set -euo pipefail
          [[ "$DISPATCHER_GENERATION" =~ ^[1-9][0-9]*$ ]] || { echo "bad dispatcher generation"; exit 1; }
          echo "DRAIN_PROCESSING_DEADLINE=$(($(date +%s) + 40 * 60))" >> "$GITHUB_ENV"
          python3 .github/scripts/pull-request-dashboard/queue_worker_client.py \
            --generation "$DISPATCHER_GENERATION" \
            --worker-id "$WORKER_ID" \
            activate

      - name: Claim queue batch
        id: claim
        run: |
          set -euo pipefail
          python3 .github/scripts/pull-request-dashboard/queue_worker_client.py \
            --generation "$DISPATCHER_GENERATION" \
            --worker-id "$WORKER_ID" \
            claim \
            --limit 16 \
            --output "$RUNNER_TEMP/dashboard-claims.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        if: steps.claim.outcome == 'success' && steps.claim.outputs.count != '0'
        run: |
          npm ci --prefix .github/scripts/pull-request-dashboard
          echo "$GITHUB_WORKSPACE/.github/scripts/pull-request-dashboard/node_modules/.bin" >> "$GITHUB_PATH"
          # A batch that classifies nothing still has to leave the cache path
          # in place, because saving a missing path fails the job.
          mkdir -p .github/scripts/pull-request-dashboard/.cache/classifications

      - name: Restore classification cache
        if: steps.claim.outcome == 'success' && steps.claim.outputs.count != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/scripts/pull-request-dashboard/.cache/classifications
          key: pull-request-dashboard-classifications-queue-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pull-request-dashboard-classifications-queue-

      - name: Process queue waves
        if: steps.claim.outcome == 'success' && steps.claim.outputs.count != '0'
        id: process
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DASHBOARD_CLIENT_ID: ${{ vars.PR_DASHBOARD_CLIENT_ID }}
          PR_DASHBOARD_PRIVATE_KEY: ${{ secrets.PR_DASHBOARD_PRIVATE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pull-request-dashboard/drain_queue.py \
            --claims "$RUNNER_TEMP/dashboard-claims.json" \
            --deadline "$DRAIN_PROCESSING_DEADLINE" \
            --generation "$DISPATCHER_GENERATION" \
            --worker "$WORKER_ID" \
            --endpoint "$PR_DASHBOARD_QUEUE_ENDPOINT" \
            --queue-mode "$DASHBOARD_QUEUE_MODE" \
            --canary-repositories-json "$CANARY_REPOSITORIES"

      - name: Save classification cache
        if: always() && steps.claim.outcome == 'success' && steps.claim.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/scripts/pull-request-dashboard/.cache/classifications
          key: pull-request-dashboard-classifications-queue-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Finish queue drain
        if: always() && steps.activate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 .github/scripts/pull-request-dashboard/queue_worker_client.py \
            --generation "$DISPATCHER_GENERATION" \
            --worker-id "$WORKER_ID" \
            finish

      - name: Check queue batch
        if: always() && steps.process.outcome == 'failure'
        run: exit 1
