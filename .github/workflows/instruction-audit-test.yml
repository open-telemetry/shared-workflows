name: Instruction audit tests

on:
  pull_request:
    paths:
      - .github/scripts/instruction-audit/**
      - .github/scripts/copilot-review-instructions/**
      - .github/workflows/instruction-audit*
      - .github/aw/actions-lock.json
      - instruction-audit/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run audit tests
        run: python3 -m unittest discover -s .github/scripts/instruction-audit -p 'test_*.py'
