# Reusable workflow — see /zizmor/README.md for consumer documentation.
name: Zizmor GitHub Actions Security Analysis

on:
  workflow_call:
    inputs:
      persona:
        description: 'Zizmor persona to use for analysis.'
        required: false
        default: regular
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 9 * * 5' # weekly at 09:45 (UTC) on Friday
  workflow_dispatch:

permissions: {}

concurrency:
  # github.workflow here would be the caller's name, not this workflow's.
  group: shared-workflow-zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read  # for private-repository SARIF uploads
      contents: read
      security-events: write  # for zizmor to upload SARIF results
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: ${{ inputs.persona || 'regular' }}
