# Reusable workflow — see /zizmor/README.md for consumer documentation.
name: Zizmor GitHub Actions Security Analysis

on:
  workflow_call:
    inputs:
      persona:
        description: 'Zizmor persona to use for analysis.'
        required: false
        default: regular
        type: string
      use-cncf-hosted-runner:
        description: 'Run Linux jobs on the standard CNCF-hosted x86 runner.'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 9 * * 5' # weekly at 09:45 (UTC) on Friday
  workflow_dispatch:

permissions: {}

concurrency:
  # github.workflow here would be the caller's name, not this workflow's.
  group: shared-workflow-zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor Security Analysis
    runs-on: ${{ inputs['use-cncf-hosted-runner'] && 'cncf-ubuntu-2-8-x86' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write  # for zizmor to upload SARIF results
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          persona: ${{ inputs.persona || 'regular' }}
