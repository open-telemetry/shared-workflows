# Reusable workflow — see /chloggen/README.md for consumer documentation.
name: Changelog

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version passed to actions/setup-go.'
        required: false
        default: 'oldstable'
        type: string
      skip-title-marker:
        description: 'Substring in the pull request title that skips changelog enforcement, in addition to any label in skip-labels. Set to an empty string to disable.'
        required: false
        default: '[chore]'
        type: string
      skip-labels:
        description: 'Comma-separated list of pull request labels that skip changelog enforcement, in addition to skip-title-marker. Set to an empty string to disable.'
        required: false
        default: 'dependencies,Skip Changelog'
        type: string
      skip-actors:
        description: 'Comma-separated list of actors for which the entire job is skipped. Set to an empty string to disable.'
        required: false
        default: 'dependabot[bot],renovate[bot]'
        type: string

permissions: {}

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-slim
    if: ${{ github.event_name == 'pull_request' && !contains(format(',{0},', inputs.skip-actors), format(',{0},', github.actor)) }}
    permissions:
      contents: read
      pull-requests: read
    env:
      SKIP_TITLE_MARKER: ${{ inputs.skip-title-marker }}
      SKIP_LABELS: ${{ inputs.skip-labels }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Determine whether changelog enforcement should be skipped
        id: skip_check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          skip=false

          if [[ -n "$SKIP_TITLE_MARKER" && "$PR_TITLE" == *"$SKIP_TITLE_MARKER"* ]]; then
            skip=true
          fi

          if [[ "$skip" == "false" ]]; then
            IFS=',' read -ra skip_labels <<< "$SKIP_LABELS"
            for label in "${skip_labels[@]}"; do
              label="$(echo "$label" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -n "$label" ]] && jq -e --arg label "$label" 'index($label) != null' <<< "$PR_LABELS_JSON" > /dev/null; then
                skip=true
                break
              fi
            done
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Check for changed files
        id: file_changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: shell
          filters: |
            changelogUpdated:
              - './CHANGELOG*.md'
            chloggenAdded:
              - './.chloggen/*.yaml'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Ensure no changes to the CHANGELOG.md or CHANGELOG-API.md
        if: steps.skip_check.outputs.skip == 'false'
        env:
          CHANGELOG_UPDATED: ${{ steps.file_changes.outputs.changelogUpdated }}
        run: |
          if [[ "$CHANGELOG_UPDATED" == "true" ]]
          then
            echo "CHANGELOG.md and CHANGELOG-API.md should not be directly modified."
            echo "Please add a .yaml file to the ./.chloggen/ directory."
            echo "See CONTRIBUTING.md for more details."
            echo "Alternately, add the \"$SKIP_TITLE_MARKER\" marker to the title of the pull request or add one of the labels in \"$SKIP_LABELS\" if this job should be skipped."
            false
          else
            echo "CHANGELOG.md and CHANGELOG-API.md were not modified."
          fi

      - name: Ensure ./.chloggen/*.yaml addition(s)
        if: steps.skip_check.outputs.skip == 'false'
        env:
          CHLOGGEN_ADDED: ${{ steps.file_changes.outputs.chloggenAdded }}
        run: |
          if [[ "$CHLOGGEN_ADDED" == "true" ]]
          then
            echo "A changelog entry was added to the ./.chloggen/ directory."
          else
            echo "No changelog entry was added to the ./.chloggen/ directory."
            echo "Please add a .yaml file to the ./.chloggen/ directory."
            echo "See CONTRIBUTING.md for more details."
            echo "Alternately, add the \"$SKIP_TITLE_MARKER\" marker to the title of the pull request or add one of the labels in \"$SKIP_LABELS\" if this job should be skipped."
            false
          fi

      - name: Validate ./.chloggen/*.yaml changes
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          make chlog-validate \
            || { echo "New ./.chloggen/*.yaml file failed validation."; exit 1; }

      # In order to validate any links in the yaml file, render the config to markdown
      - name: Render .chloggen changelog entries
        if: steps.skip_check.outputs.skip == 'false'
        run: make chlog-preview > changelog_preview.md

      - name: Link Checker
        if: steps.skip_check.outputs.skip == 'false'
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--verbose --no-progress ./changelog_preview.md --config .github/lychee.toml"
          failIfEmpty: false
