name: Deploy pull request dashboard webhook

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/pull-request-dashboard/netlify.toml
      - .github/scripts/pull-request-dashboard/netlify/**
      - .github/scripts/pull-request-dashboard/package-lock.json
      - .github/scripts/pull-request-dashboard/package.json
      - .github/scripts/pull-request-dashboard/public/**
      - .github/workflows/pull-request-dashboard-deploy-webhook.yml
      - .github/workflows/pull-request-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-dashboard-deploy-webhook
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'open-telemetry/shared-workflows'
    runs-on: ubuntu-latest
    environment: protected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure Netlify dispatcher environment
        working-directory: .github/scripts/pull-request-dashboard
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_PR_DASHBOARD_PROJECT_ID }}
          OTELBOT_SHARED_WORKFLOWS_CLIENT_ID: ${{ vars.OTELBOT_SHARED_WORKFLOWS_CLIENT_ID }}
          OTELBOT_SHARED_WORKFLOWS_PRIVATE_KEY: ${{ secrets.OTELBOT_SHARED_WORKFLOWS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          queue_mode=canary
          dashboard_workflow="../../workflows/pull-request-dashboard.yml"
          mapfile -t stable_refs < <(
            sed -nE \
              's#^[[:space:]]*uses: open-telemetry/shared-workflows/\.github/workflows/pull-request-dashboard-repo\.yml@([0-9a-f]{40}).*$#\1#p' \
              "$dashboard_workflow" |
              sort -u
          )
          if [[ "${#stable_refs[@]}" -gt 1 ]]; then
            echo "::error::Stable dashboard jobs use different workflow refs"
            exit 1
          fi
          if [[ "${#stable_refs[@]}" -eq 1 ]]; then
            stable_ref="${stable_refs[0]}"
            git fetch --no-tags --depth=1 origin "$stable_ref"
            stable_workflow=$(git show "$stable_ref:.github/workflows/pull-request-dashboard-repo.yml")
            stable_queue_ready=true
            for requirement in acquire-publisher-lock release-publisher-lock "timeout-minutes: 50"; do
              if ! grep -Fq -- "$requirement" <<< "$stable_workflow"; then
                echo "::notice::Stable dashboard workflow $stable_ref lacks $requirement; deploying canary queue mode"
                stable_queue_ready=false
              fi
            done
            if [[ "$stable_queue_ready" == "true" ]]; then
              queue_mode=all
            fi
          fi
          echo "Deploying pull request dashboard queue mode: $queue_mode"
          dispatcher_private_key_base64=$(printf '%s' "$OTELBOT_SHARED_WORKFLOWS_PRIVATE_KEY" | base64 -w0)
          echo "::add-mask::$dispatcher_private_key_base64"
          # Remove the deprecated variable left by App ID deployments.
          npx --yes netlify-cli@26.0.2 env:unset OTELBOT_SHARED_WORKFLOWS_APP_ID \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --force || true
          npx --yes netlify-cli@26.0.2 env:unset OTELBOT_SHARED_WORKFLOWS_CLIENT_ID \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --force || true
          npx --yes netlify-cli@26.0.2 env:unset OTELBOT_SHARED_WORKFLOWS_PRIVATE_KEY_BASE64 \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --force || true
          npx --yes netlify-cli@26.0.2 env:set OTELBOT_SHARED_WORKFLOWS_CLIENT_ID "$OTELBOT_SHARED_WORKFLOWS_CLIENT_ID" \
            --context production \
            --scope functions \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --force
          npx --yes netlify-cli@26.0.2 env:set OTELBOT_SHARED_WORKFLOWS_PRIVATE_KEY_BASE64 "$dispatcher_private_key_base64" \
            --context production \
            --scope functions \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --secret \
            --force
          npx --yes netlify-cli@26.0.2 env:set PR_DASHBOARD_QUEUE_MODE "$queue_mode" \
            --context production \
            --scope functions \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --force

      - name: Install function dependencies
        working-directory: .github/scripts/pull-request-dashboard
        # The functions import @netlify/blobs and jose, which the Netlify
        # bundler resolves from node_modules while packaging the deploy.
        run: npm ci

      - name: Deploy Netlify function
        working-directory: .github/scripts/pull-request-dashboard
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_PR_DASHBOARD_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p public
          npx --yes netlify-cli@26.0.2 deploy \
            --prod \
            --dir public \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "${GITHUB_REPOSITORY}@${GITHUB_SHA}"
