name: Collect GitHub Actions queue data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_windows:
        description: Maximum live and backfill windows to collect (1-20).
        required: false
        default: 20
        type: number

permissions: {}

concurrency:
  group: github-actions-queue-collector
  cancel-in-progress: false

env:
  DATA_BRANCH: otelbot/github-actions-queue-data
  BACKFILL_START: "2026-09-17T02:00:00Z"
  BACKFILL_TARGET: "2026-01-01T00:00:00Z"

jobs:
  collect:
    if: github.repository == 'open-telemetry/shared-workflows'
    runs-on: ubuntu-latest
    environment: protected
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List public repositories
        id: repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'names<<EOF'
            gh api --paginate --method GET /orgs/open-telemetry/repos \
              -f type=public -f per_page=100 --jq '.[].name'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: collector-token
        with:
          client-id: ${{ vars.ACTIONS_TELEMETRY_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_TELEMETRY_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ steps.repositories.outputs.names }}
          permission-actions: read

      - name: Check out data branch
        id: data
        env:
          DATA_BRANCH_README: .github/scripts/github-actions-queue/DATA_BRANCH_README.md
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/github-actions-queue-data"
          if git ls-remote --exit-code --heads origin "refs/heads/$DATA_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$data_dir" FETCH_HEAD
          else
            git worktree add --detach "$data_dir" HEAD
            git -C "$data_dir" switch --orphan "$DATA_BRANCH"
            cp "$DATA_BRANCH_README" "$data_dir/README.md"
          fi
          echo "directory=$data_dir" >> "$GITHUB_OUTPUT"

      - name: Collect completed jobs
        id: collect
        env:
          GH_TOKEN: ${{ steps.collector-token.outputs.token }}
          DATA_DIRECTORY: ${{ steps.data.outputs.directory }}
          MAX_WINDOWS: ${{ inputs.max_windows }}
        run: |
          set -euo pipefail
          max_windows="${MAX_WINDOWS:-20}"
          if (( max_windows < 1 || max_windows > 20 )); then
            echo "::error::max_windows must be between 1 and 20"
            exit 1
          fi
          summary=$(
            python3 .github/scripts/github-actions-queue/collect.py \
              --state "$DATA_DIRECTORY/state.json" \
              --backfill-state "$DATA_DIRECTORY/backfill-state.json" \
              --backfill-start "$BACKFILL_START" \
              --backfill-target "$BACKFILL_TARGET" \
              --output-dir "$DATA_DIRECTORY/jobs" \
              --collection-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --max-windows "$max_windows" \
              --max-workers 4 \
              --max-requests 12000 \
              --max-runtime-seconds 2400
          )
          echo "$summary" | jq .
          {
            echo "### GitHub Actions queue collection"
            echo
            echo '```json'
            echo "$summary" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "cursor=$(jq -r .cursor <<< "$summary")" >> "$GITHUB_OUTPUT"
          echo "paused=$(jq -r .paused <<< "$summary")" >> "$GITHUB_OUTPUT"
          echo "pause_reason=$(jq -r .pause_reason <<< "$summary")" >> "$GITHUB_OUTPUT"
          echo "pending_run_failures=$(jq -r .pending_run_failures <<< "$summary")" >> "$GITHUB_OUTPUT"

      - name: Commit collected data
        env:
          CURSOR: ${{ steps.collect.outputs.cursor }}
          DATA_DIRECTORY: ${{ steps.data.outputs.directory }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C "$DATA_DIRECTORY" config user.name "github-actions[bot]"
          git -C "$DATA_DIRECTORY" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DATA_DIRECTORY" add --all
          if git -C "$DATA_DIRECTORY" diff --cached --quiet; then
            echo "No data or checkpoint changes to commit"
            exit 0
          fi
          git -C "$DATA_DIRECTORY" commit -m "Collect queue data through $CURSOR"
          gh auth setup-git
          git -C "$DATA_DIRECTORY" push origin "HEAD:refs/heads/$DATA_BRANCH"

      - name: Report collection pause
        if: steps.collect.outputs.paused == 'true'
        env:
          PAUSE_REASON: ${{ steps.collect.outputs.pause_reason }}
        run: |
          echo "::notice::Collection paused at $PAUSE_REASON; the next run will resume from the saved checkpoint"

      - name: Report failed run retries
        if: steps.collect.outputs.pending_run_failures != '0'
        env:
          FAILED_RUNS: ${{ steps.collect.outputs.pending_run_failures }}
        run: |
          echo "::warning::$FAILED_RUNS workflow runs have job API failures recorded in collector state and will be retried"

  notify-collection-failure:
    needs:
      - collect
    # Every manual invocation runs the full organization collector. Skip forks
    # where the collect job is intentionally disabled.
    if: >-
      always() &&
      github.repository == 'open-telemetry/shared-workflows' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      issues: write # needed to open or close the collection failure tracking issue
    uses: ./.github/workflows/workflow-failure-issue.yml
    with:
      # Unlike the dashboard's replaceable matrix publishers, this single job
      # has no superseding worker. Cancellation therefore counts as failure.
      success: ${{ needs.collect.result == 'success' }}
