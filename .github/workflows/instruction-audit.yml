name: Instruction audit

on:
  workflow_call:
    inputs:
      publish:
        description: Allow one draft PR for a publishable finding
        type: boolean
        default: false
      otelbot_client_id:
        description: Client ID for the caller's otelbot installation
        type: string
    secrets:
      otelbot_private_key:
        description: Private key for otelbot, needed only to publish a draft

permissions: {}

concurrency:
  group: instruction-audit
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    if: github.repository_owner == 'open-telemetry' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      digest: ${{ steps.audit.outputs.digest }}
      repository: ${{ steps.audit.outputs.repository }}
      fix: ${{ steps.audit.outputs.fix }}
      save_cursor: ${{ steps.audit.outputs.save_cursor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Install Copilot CLI
        run: |
          npm ci --ignore-scripts --prefix .github/scripts/instruction-audit
          echo "$GITHUB_WORKSPACE/.github/scripts/instruction-audit/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: github/gh-aw-firewall@d9272015d8523b4c9cf3b00ce26b507046cbf1a3 # v0.29.11
        id: firewall
        with:
          version: v0.29.11
      - name: Audit remaining instructions until the first finding
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          AUDIT_PUBLISH: ${{ inputs.publish }}
          AWF_IMAGE_TAG: ${{ steps.firewall.outputs.image-tag }}
        run: python3 .github/scripts/instruction-audit/audit.py audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instruction-audit
          path: audit-result.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: audit
    if: github.run_attempt == 1 && inputs.publish && needs.audit.outputs.fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      handled: ${{ steps.publish.outputs.handled }}
    env:
      RESULT_DIGEST: ${{ needs.audit.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instruction-audit
      - name: Validate the Markdown fix
        run: python3 .github/scripts/instruction-audit/audit.py validate-publish
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: otelbot
        with:
          client-id: ${{ inputs.otelbot_client_id }}
          private-key: ${{ secrets.otelbot_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.audit.outputs.repository }}
          permission-pull-requests: write
      - name: Write the draft branch in the caller repository
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/instruction-audit/audit.py create-branch
      - name: Open at most one draft PR
        if: steps.branch.outputs.created == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ steps.otelbot.outputs.token }}
        run: python3 .github/scripts/instruction-audit/audit.py publish

  cursor:
    needs: [audit, publish]
    if: >-
      !cancelled() && github.run_attempt == 1 && needs.audit.result == 'success' &&
      (needs.audit.outputs.save_cursor == 'true' ||
       (needs.publish.result == 'success' && needs.publish.outputs.handled == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RESULT_DIGEST: ${{ needs.audit.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instruction-audit
      - name: Save the cursor
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_PUBLISHED: ${{ needs.publish.result == 'success' && needs.publish.outputs.handled == 'true' }}
        run: python3 .github/scripts/instruction-audit/audit.py save
