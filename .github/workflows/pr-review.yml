name: PR review

run-name: Review ${{ inputs.pr_url }}

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: GitHub PR URL in an opted-in OpenTelemetry repository
        required: true
        type: string

permissions: {}

jobs:
  gate:
    if: github.repository == 'open-telemetry/shared-workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.gate.outputs.repository }}
      owner: ${{ steps.gate.outputs.owner }}
      repo_name: ${{ steps.gate.outputs.repo_name }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve target repository
        id: gate
        env:
          PR_URL: ${{ inputs.pr_url }}
        run: python .github/scripts/pr-review/gate.py

  review:
    needs: gate
    concurrency:
      group: pr-review-${{ needs.gate.outputs.repository }}-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Copilot CLI
        run: |
          npm ci --prefix .github/scripts/copilot-cli
          echo "$GITHUB_WORKSPACE/.github/scripts/copilot-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: github/gh-aw-firewall@d9272015d8523b4c9cf3b00ce26b507046cbf1a3 # v0.29.11
        id: firewall
        with:
          version: v0.29.11
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: read-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          owner: ${{ needs.gate.outputs.owner }}
          repositories: ${{ needs.gate.outputs.repo_name }}
          permission-contents: read
          permission-pull-requests: read
      - name: Review, simplify, and double-check
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          AWF_IMAGE_TAG: ${{ steps.firewall.outputs.image-tag }}
          PR_URL: ${{ inputs.pr_url }}
        run: python .github/scripts/pr-review/review.py "$PR_URL" prepare review-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-result
          path: review-result.json
          if-no-files-found: error
          retention-days: 7

  post:
    needs: [gate, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-result
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: write-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          owner: ${{ needs.gate.outputs.owner }}
          repositories: ${{ needs.gate.outputs.repo_name }}
          permission-pull-requests: write
          permission-issues: write
      - name: Post the result as otelbot
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PR_URL: ${{ inputs.pr_url }}
        run: python .github/scripts/pr-review/review.py "$PR_URL" post review-result.json
