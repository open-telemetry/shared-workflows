name: Pull request dashboard

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository. Empty means all configured repositories.
        required: false
        type: string
      pr_number:
        description: Pull request number to refresh. Empty means backfill.
        required: false
        type: string
      head_sha:
        description: Head commit to resolve to a pull request when the event carries no number.
        required: false
        type: string
      trigger_event:
        description: Event that requested the refresh.
        required: false
        type: string
permissions:
  contents: read

# resolve-targets normally finishes in seconds, but during organization-wide
# runner queueing, redundant webhook runs can accumulate into a large backlog
# before job-level concurrency applies.
#
# Dashboard state is loaded live, so only the latest pending webhook refresh is
# needed. Manual runs remain separate because they can refresh large
# repositories that webhooks skip. Submitted reviews can coalesce with generic
# PR refreshes because the live status comment no longer depends on a specific
# review id.
concurrency:
  group: >-
    pull-request-dashboard-${{ inputs.repository || 'all-repositories' }}-${{ inputs.pr_number || inputs.head_sha || 'backfill' }}-${{ github.event_name == 'workflow_dispatch' && (inputs.trigger_event == '' || inputs.trigger_event == 'workflow_dispatch') && 'manual' || 'refresh' }}
  cancel-in-progress: false

env:
  DASHBOARD_CONFIG: .github/scripts/pull-request-dashboard/repositories.json

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: protected
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      pr_number: ${{ steps.trigger.outputs.pr_number }}
      dashboard_precondition_met: ${{ steps.dashboard-precondition.outputs.met }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve target repositories
        id: targets
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg repo "$TARGET_REPOSITORY" '
            if $repo == "" then
              .
            else
              [ .[] | select(.name == $repo or ("open-telemetry/" + .name) == $repo) ]
            end
          ' "$DASHBOARD_CONFIG")
          if [[ "$matrix" == "[]" ]]; then
            echo "no configured repository matched: ${TARGET_REPOSITORY:-<all>}" >&2
            exit 1
          fi
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r '.[0].name' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: head-sha-token
        if: inputs.head_sha != '' && inputs.pr_number == ''
        with:
          client-id: ${{ vars.PR_DASHBOARD_CLIENT_ID }}
          private-key: ${{ secrets.PR_DASHBOARD_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ steps.targets.outputs.repository }}
          permission-pull-requests: read

      - name: Resolve trigger inputs
        id: trigger
        env:
          TARGET_REPOSITORY_FROM_INPUT: ${{ inputs.repository }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          HEAD_SHA_FROM_INPUT: ${{ inputs.head_sha }}
          TRIGGER_EVENT_FROM_INPUT: ${{ inputs.trigger_event }}
          REPO_NAME: ${{ steps.targets.outputs.repository }}
          GH_TOKEN: ${{ steps.head-sha-token.outputs.token }}
        run: |
          set -euo pipefail
          pr_number="$PR_FROM_INPUT"
          head_sha="$HEAD_SHA_FROM_INPUT"
          trigger_event="$TRIGGER_EVENT_FROM_INPUT"

          if [[ -n "$pr_number" ]]; then
            [[ "$pr_number" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "bad PR number: $pr_number"; exit 1; }
            [[ -n "$TARGET_REPOSITORY_FROM_INPUT" ]] || { echo "repository is required when pr_number is set"; exit 1; }
          fi
          if [[ -n "$head_sha" ]]; then
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head SHA: $head_sha"; exit 1; }
            [[ -n "$TARGET_REPOSITORY_FROM_INPUT" ]] || { echo "repository is required when head_sha is set"; exit 1; }
          fi
          if [[ -n "$trigger_event" ]]; then
            [[ "$trigger_event" =~ ^(schedule|workflow_dispatch|check_suite|check_run|status|pull_request|issue_comment|pull_request_review|pull_request_review_comment|pull_request_review_thread)$ ]] \
              || { echo "bad trigger event: $trigger_event"; exit 1; }
          fi

          # Check suites, check runs and commit statuses on a fork head carry no
          # pull request association, so they report the head commit instead.
          if [[ -z "$pr_number" && -n "$head_sha" ]]; then
            matches=$(gh api "repos/open-telemetry/${REPO_NAME}/commits/${head_sha}/pulls" \
              | jq -r --arg sha "$head_sha" '[ .[] | select(.state == "open" and .head.sha == $sha) | .number ] | sort | join(" ")')
            pr_number="${matches%% *}"
            if [[ -z "$pr_number" ]]; then
              echo "no open pull request has head $head_sha; skipping refresh."
            elif [[ "$matches" == *" "* ]]; then
              # One head branch can be open against several base branches. The
              # rest keep refreshing on their own events and on the backfill.
              echo "head $head_sha belongs to open pull requests $matches; refreshing #$pr_number"
            else
              echo "resolved head $head_sha to pull request #$pr_number"
            fi
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check dashboard precondition
        id: dashboard-precondition
        env:
          TRIGGER_PR_NUMBER: ${{ steps.trigger.outputs.pr_number }}
          HEAD_SHA_FROM_INPUT: ${{ inputs.head_sha }}
          REPO_NAME: ${{ steps.targets.outputs.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$TRIGGER_PR_NUMBER" ]]; then
            # An unresolved head commit is not a request to refresh every PR.
            if [[ -n "$HEAD_SHA_FROM_INPUT" ]]; then
              echo "met=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "met=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state_branch="otelbot/pull-request-dashboard-state/${REPO_NAME}"
          initial_backfill_complete=$(python3 .github/scripts/pull-request-dashboard/state.py \
            --repo "$REPO_NAME" \
            --state-branch "$state_branch")
          if [[ "$initial_backfill_complete" == "true" ]]; then
            echo "met=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$initial_backfill_complete" == "false" ]]; then
            echo "Initial dashboard backfill is incomplete; skipping targeted refresh."
            echo "met=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unexpected initial backfill result: $initial_backfill_complete" >&2
          exit 1

  run-repo-dashboard:
    needs: resolve-targets
    if: needs.resolve-targets.outputs.dashboard_precondition_met == 'true'
    permissions:
      contents: write
      copilot-requests: write
    strategy:
      fail-fast: false
      # Repositories hold separate state branches, so they only contend for the
      # shared GitHub App rate limit and the Copilot CLI token.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    uses: ./.github/workflows/pull-request-dashboard-repo.yml
    with:
      repository: ${{ matrix.name }}
      pr_number: ${{ needs.resolve-targets.outputs.pr_number }}
      required_approvals: ${{ matrix.required_approvals || 1 }}
      approver_teams_json: ${{ toJSON(matrix.approver_teams || fromJSON('[]')) }}
      non_blocking_check_patterns_json: ${{ toJSON(matrix.non_blocking_check_patterns || fromJSON('[]')) }}
      require_clean_copilot_review_branches_json: ${{ toJSON(matrix.require_clean_copilot_review_branches || fromJSON('[]')) }}
      slack_channel: ${{ matrix.slack_channel }}
      slack_user_mapping_json: ${{ toJSON(matrix.slack_user_mapping || fromJSON('{}')) }}
      large_repo: ${{ matrix.large_repo || false }}
      labels_to_display_json: ${{ toJSON(matrix.labels_to_display || fromJSON('[]')) }}
    secrets:
      PR_DASHBOARD_PRIVATE_KEY: ${{ secrets.PR_DASHBOARD_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-hourly-failure:
    needs:
      - resolve-targets
      - run-repo-dashboard
    # Notify for backfills: scheduled runs and unfiltered manual runs.
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.repository == '' &&
          inputs.pr_number == ''
        )
      )
    permissions:
      issues: write # needed to open/close the hourly failure tracking issue
    uses: ./.github/workflows/workflow-failure-issue.yml
    with:
      # GitHub replaces an older pending per-repo publisher even with
      # cancel-in-progress disabled. Its replacement drains all durable work,
      # while genuine matrix failures take precedence over cancellation.
      success: ${{ needs.resolve-targets.result == 'success' && (needs.run-repo-dashboard.result == 'success' || needs.run-repo-dashboard.result == 'cancelled') }}
