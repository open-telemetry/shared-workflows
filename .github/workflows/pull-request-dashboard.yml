name: Pull request dashboard

run-name: >-
  pull-request-dashboard-${{ inputs.repository || 'all-repositories' }}-${{ inputs.pr_number || inputs.head_sha || 'backfill' }}-${{ github.event_name == 'workflow_dispatch' && (inputs.trigger_event == '' || inputs.trigger_event == 'workflow_dispatch') && 'manual' || 'refresh' }}

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository. Empty means all configured repositories.
        required: false
        type: string
      pr_number:
        description: Pull request number to refresh. Empty means backfill.
        required: false
        type: string
      head_sha:
        description: Head commit to resolve to a pull request when the event carries no number.
        required: false
        type: string
      trigger_event:
        description: Event that requested the refresh.
        required: false
        type: string
      request_item_key:
        description: Inspect a previously accepted queue item instead of requesting work.
        required: false
        type: string
      request_generation:
        description: Generation returned when the queue accepted the item.
        required: false
        type: string
      request_id:
        description: Request ID returned when the queue accepted the item.
        required: false
        type: string

permissions:
  contents: read

# Queue items coalesce work; enqueue runs must not replace one another.
concurrency:
  group: pull-request-dashboard-enqueue-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    environment: protected
    permissions:
      contents: read
      id-token: write
    env:
      PR_DASHBOARD_QUEUE_ENDPOINT: https://otel-pull-request-dashboard.netlify.app/.netlify/functions/dashboard-queue-worker
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TRIGGER_PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      TRIGGER_EVENT: ${{ inputs.trigger_event || github.event_name }}
      REQUEST_ITEM_KEY: ${{ inputs.request_item_key }}
      REQUEST_GENERATION: ${{ inputs.request_generation }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accept work or report request progress
        env:
          OTEL_GITHUB_STEP_NAME: Accept work or report request progress
          OTEL_GITHUB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          export TRACEPARENT="$(bash .github/scripts/pull-request-dashboard/github_traceparent.sh)"
          python3 .github/scripts/pull-request-dashboard/enqueue_dashboard.py
