name: Collect PR review metrics

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-review-metrics-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'open-telemetry/shared-workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      snapshot: ${{ steps.collect.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Copilot SDK
        run: python -m pip install -r .github/scripts/pr-review-metrics/requirements.txt

      - name: Capture and assess one bounded batch
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0
          python -u .github/scripts/pr-review-metrics/collect_hosted.py collect \
            --work "$RUNNER_TEMP/pr-review-metrics" \
            --artifact "$RUNNER_TEMP/pr-review-metrics-artifact" \
            > "$RUNNER_TEMP/pr-review-metrics-summary.json" || status=$?
          if [[ -s "$RUNNER_TEMP/pr-review-metrics-summary.json" ]]; then
            {
              echo '### PR review metrics'
              echo
              echo '```json'
              jq . "$RUNNER_TEMP/pr-review-metrics-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s "$RUNNER_TEMP/pr-review-metrics-artifact/snapshot.json" ]]; then
            echo 'snapshot=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.collect.outputs.snapshot == 'true' }}
        with:
          name: pr-review-metrics-snapshot-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review-metrics-artifact
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ !cancelled() && needs.collect.outputs.snapshot == 'true' }}
    needs: collect
    runs-on: ubuntu-latest
    environment: protected
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-metrics-snapshot-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review-metrics-artifact

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pr-review-metrics/collect_hosted.py publish \
            --artifact "$RUNNER_TEMP/pr-review-metrics-artifact"
