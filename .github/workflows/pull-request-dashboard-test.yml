name: Pull request dashboard tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install JavaScript dependencies
        working-directory: .github/scripts/pull-request-dashboard
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3.0.0

      - name: Install Python dependencies
        working-directory: .github/scripts/pull-request-dashboard
        run: uv sync --frozen

      - name: Run Python tests
        working-directory: .github/scripts/pull-request-dashboard
        run: uv run python -m unittest discover -p 'test_*.py'

      - name: Run JavaScript tests
        working-directory: .github/scripts/pull-request-dashboard
        run: node --test 'test_*.mjs'
