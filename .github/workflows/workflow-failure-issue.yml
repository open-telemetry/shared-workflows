# Reusable workflow — see /workflow-failure-issue/README.md for consumer documentation.
name: Workflow failure issue

on:
  workflow_call:
    inputs:
      success:
        type: boolean
        required: true

permissions: {}

concurrency:
  group: shared-workflow-failure-issue-${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  workflow-failure-issue:
    name: Open or close workflow failure issue
    if: github.repository_owner == 'open-telemetry' && !cancelled()
    permissions:
      issues: write # needed to open, comment on, and close workflow failure issues
    runs-on: ubuntu-slim
    steps:
      - name: Open issue or add comment if issue already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_SUCCESS: ${{ inputs.success }}
        run: |
          set -euo pipefail

          tracking_label="workflow-failure-$(printf '%s' "$GITHUB_WORKFLOW_REF" | sha256sum | cut -c1-32)"
          if ! gh api "repos/$GITHUB_REPOSITORY/labels/$tracking_label" >/dev/null 2>&1; then
            gh label create "$tracking_label" \
                            --color D93F0B \
                            --description "Managed by the shared workflow failure issue"
          fi

          label_numbers=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$tracking_label&per_page=100" \
              --jq '
                .[]
                | select(.pull_request == null)
                | .number
              '
          )
          search_query="repo:$GITHUB_REPOSITORY is:issue is:open \"Workflow failed\" in:title"
          unlabelled_candidates=$(
            TRACKING_LABEL="$tracking_label" WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              gh api --paginate --method GET search/issues \
              -f q="$search_query" \
              -f per_page=100 \
              --jq '
                .items[]
                | select(
                    (.title | startswith("Workflow failed: " + env.GITHUB_WORKFLOW + " (#"))
                    and ((.labels | map(.name) | index(env.TRACKING_LABEL)) == null)
                  )
                | [
                    .number,
                    (
                      if ((.body // "") | contains("<!-- workflow-failure-ref: " + env.WORKFLOW_REF + " -->"))
                      then "match"
                      else ((.body // "") | capture("/actions/runs/(?<id>[0-9]+)")?.id // "unknown")
                      end
                    )
                  ]
                | @tsv
              '
          )
          unlabelled_numbers=$(
            while IFS=$'\t' read -r number run_id; do
              if [[ -z "$number" ]]; then
                continue
              elif [[ "$run_id" == "match" ]]; then
                echo "$number"
              elif [[ "$run_id" != "unknown" ]]; then
                if candidate_ref=$(
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                    --jq '"\(.repository.full_name)/\(.path)@refs/heads/\(.head_branch)"'
                ); then
                  if [[ "$candidate_ref" == "$GITHUB_WORKFLOW_REF" ]]; then
                    echo "$number"
                  fi
                else
                  echo "Unable to verify workflow identity for issue #$number from run $run_id" >&2
                fi
              fi
            done <<< "$unlabelled_candidates"
          )
          numbers=$(
            printf '%s\n%s\n' "$label_numbers" "$unlabelled_numbers" \
              | sed '/^$/d' \
              | sort -n -u
          )
          if [[ -n "$numbers" ]]; then
            mapfile -t issue_numbers <<< "$numbers"
          else
            issue_numbers=()
          fi

          if [[ -n "$unlabelled_numbers" ]]; then
            mapfile -t unlabelled_issue_numbers <<< "$unlabelled_numbers"
            for number in "${unlabelled_issue_numbers[@]}"; do
              gh issue edit "$number" --add-label "$tracking_label"
            done
          fi

          echo "$numbers"
          echo "$INPUT_SUCCESS"

          if (( ${#issue_numbers[@]} > 0 )); then
            if [[ "$INPUT_SUCCESS" == "true" ]]; then
              for number in "${issue_numbers[@]}"; do
                gh issue close "$number"
              done
            else
              gh issue comment "${issue_numbers[0]}" \
                               --body "See [$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              for number in "${issue_numbers[@]:1}"; do
                gh issue close "$number" \
                               --reason "not planned" \
                               --comment "Superseded by #${issue_numbers[0]}."
              done
            fi
          elif [[ "$INPUT_SUCCESS" == "false" ]]; then
            gh issue create --title "Workflow failed: $GITHUB_WORKFLOW (#$GITHUB_RUN_NUMBER)" \
                            --body "<!-- workflow-failure-ref: $GITHUB_WORKFLOW_REF -->
          See [$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
                            --label "$tracking_label"
          fi
