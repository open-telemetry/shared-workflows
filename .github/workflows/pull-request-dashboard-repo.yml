name: Pull request dashboard repo

on:
  workflow_call:
    inputs:
      # The concurrency groups below key off this raw input, so any alternate
      # spelling would split them while still writing one state branch.
      repository:
        required: true
        type: string
      pr_number:
        required: false
        default: ""
        type: string
      # Kept temporarily so stable callers pinned to a pre-self-action release
      # can pass the ref that those releases still check out. This workflow
      # loads its code through the self-repository action and ignores the input.
      code_ref:
        required: false
        default: ""
        type: string
    secrets:
      PR_DASHBOARD_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read

env:
  DASHBOARD_CONFIG: .github/scripts/pull-request-dashboard/repositories.json
  DASHBOARD_STATE_BRANCH_PREFIX: otelbot/pull-request-dashboard-state

jobs:
  update-dashboard:
    concurrency:
      group: ${{ github.workflow }}-state-${{ inputs.repository }}-${{ inputs.pr_number || 'backfill' }}
      cancel-in-progress: false
    permissions:
      contents: write
      copilot-requests: write
    environment: protected
    runs-on: ubuntu-latest
    outputs:
      initial_backfill_complete: ${{ steps.dashboard-update.outputs.initial_backfill_complete }}
    steps:
      # `$` resolves this same-repository action from the reusable workflow's exact commit.
      - name: Load dashboard code
        id: dashboard-code
        uses: $/.github/scripts/pull-request-dashboard

      # The checkout supplies current repository configuration and the Git
      # context used to manage dashboard state worktrees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load repository configuration
        id: config
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TRIGGER_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -n "$TRIGGER_PR_NUMBER" ]]; then
            [[ "$TRIGGER_PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "bad PR number: $TRIGGER_PR_NUMBER"; exit 1; }
          fi
          entry=$(jq -c --arg repo "$TARGET_REPOSITORY" '
            [ .[] | select(.name == $repo) ] | first
          ' "$DASHBOARD_CONFIG")
          if [[ "$entry" == "null" ]]; then
            echo "no configured repository matched: $TARGET_REPOSITORY" >&2
            exit 1
          fi
          {
            echo "name=$(jq -r '.name' <<< "$entry")"
            echo "required_approvals=$(jq -r '.required_approvals // 1' <<< "$entry")"
            echo "approver_teams_json=$(jq -c '.approver_teams // []' <<< "$entry")"
            echo "non_blocking_check_patterns_json=$(jq -c '.non_blocking_check_patterns // []' <<< "$entry")"
            echo "require_clean_copilot_review_branches_json=$(jq -c '.require_clean_copilot_review_branches // []' <<< "$entry")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dashboard-token
        with:
          client-id: ${{ vars.PR_DASHBOARD_CLIENT_ID }}
          private-key: ${{ secrets.PR_DASHBOARD_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ steps.config.outputs.name }}
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-members: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Restore per-PR classification cache
        if: inputs.pr_number != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dashboard-code.outputs.path }}/.cache/classifications
          key: pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-${{ inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-${{ inputs.pr_number }}-
            pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-all-

      - name: Restore shared backfill classification cache
        if: inputs.pr_number == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dashboard-code.outputs.path }}/.cache/classifications
          key: pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-all-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-all-

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Copilot CLI
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
        run: |
          npm ci --prefix "$DASHBOARD_CODE"
          echo "$DASHBOARD_CODE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate and update dashboard state
        id: dashboard-update
        env:
          TRIGGER_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ steps.dashboard-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Copilot CLI resolves auth in the order COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN.
          # GH_TOKEN holds the app installation token, which cannot make Copilot requests, so the
          # CLI has to be pointed explicitly at the Actions token granted copilot-requests: write.
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          PR_DASHBOARD_TOKEN: ${{ steps.dashboard-token.outputs.token }}
          REPO_NAME: ${{ steps.config.outputs.name }}
          REQUIRED_APPROVALS: ${{ steps.config.outputs.required_approvals }}
          APPROVER_TEAMS_JSON: ${{ steps.config.outputs.approver_teams_json }}
          NON_BLOCKING_CHECK_PATTERNS_JSON: ${{ steps.config.outputs.non_blocking_check_patterns_json }}
          REQUIRE_CLEAN_COPILOT_REVIEW_BRANCHES_JSON: ${{ steps.config.outputs.require_clean_copilot_review_branches_json }}
          PREPARE_AUTHOR_NUDGES: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          state_branch="${DASHBOARD_STATE_BRANCH_PREFIX}/${REPO_NAME}"

          # A targeted refresh has nothing to update until the first full
          # backfill has populated the state branch.
          if [[ -n "${TRIGGER_PR_NUMBER:-}" ]]; then
            initial_backfill_complete=$(python3 "$DASHBOARD_CODE/state.py" \
              --repo "$REPO_NAME" \
              --state-branch "$state_branch")
            case "$initial_backfill_complete" in
              true) ;;
              false)
                echo "Initial dashboard backfill is incomplete; skipping targeted refresh."
                exit 0
                ;;
              *)
                echo "unexpected initial backfill result: $initial_backfill_complete" >&2
                exit 1
                ;;
            esac
          fi

          dashboard_args=(--state-branch "$state_branch" --repo "$REPO_NAME" --github-output "$GITHUB_OUTPUT")
          dashboard_args+=(--required-approvals "$REQUIRED_APPROVALS")
          for team in $(jq -r '.[]' <<< "$APPROVER_TEAMS_JSON"); do
            dashboard_args+=(--approver-team "$team")
          done
          mapfile -t non_blocking_check_patterns < <(jq -r '.[]' <<< "$NON_BLOCKING_CHECK_PATTERNS_JSON")
          for pattern in "${non_blocking_check_patterns[@]}"; do
            dashboard_args+=(--non-blocking-check-pattern "$pattern")
          done
          mapfile -t require_clean_copilot_review_branches < <(jq -r '.[]' <<< "$REQUIRE_CLEAN_COPILOT_REVIEW_BRANCHES_JSON")
          for branch in "${require_clean_copilot_review_branches[@]}"; do
            dashboard_args+=(--require-clean-copilot-review-branch "$branch")
          done
          if [[ "${PREPARE_AUTHOR_NUDGES:-false}" == "true" ]]; then
            dashboard_args+=(--prepare-author-nudges)
          fi
          if [[ -n "${TRIGGER_PR_NUMBER:-}" ]]; then
            dashboard_args+=(--pr-number "$TRIGGER_PR_NUMBER")
          fi
          python3 "$DASHBOARD_CODE/dashboard.py" "${dashboard_args[@]}"

      - name: Save per-PR classification cache
        # Preserve valid classifications even when another item fails the update.
        if: always() && steps.dashboard-code.outcome == 'success' && inputs.pr_number != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dashboard-code.outputs.path }}/.cache/classifications
          key: pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-${{ inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save shared backfill classification cache
        # Preserve valid classifications even when another item fails the update.
        if: always() && steps.dashboard-code.outcome == 'success' && inputs.pr_number == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dashboard-code.outputs.path }}/.cache/classifications
          key: pull-request-dashboard-classifications-${{ steps.config.outputs.name }}-all-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report GitHub App rate limits
        if: always() && steps.dashboard-code.outcome == 'success'
        continue-on-error: true
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GH_TOKEN: ${{ steps.dashboard-token.outputs.token }}
        run: python3 "$DASHBOARD_CODE/report_rate_limits.py"

  publish-dashboard:
    needs: update-dashboard
    if: >-
      always() &&
      (needs.update-dashboard.result == 'success' || inputs.pr_number == '') &&
      needs.update-dashboard.outputs.initial_backfill_complete == 'true'
    concurrency:
      group: pull-request-dashboard-publish-${{ inputs.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    environment: protected
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PUBLISHER_LOCK_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-publish
    steps:
      # `$` resolves this same-repository action from the reusable workflow's exact commit.
      - name: Load dashboard code
        id: dashboard-code
        uses: $/.github/scripts/pull-request-dashboard

      # The checkout supplies current repository configuration and the Git
      # context used to manage dashboard state worktrees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load repository configuration
        id: config
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          entry=$(jq -c --arg repo "$TARGET_REPOSITORY" '
            [ .[] | select(.name == $repo) ] | first
          ' "$DASHBOARD_CONFIG")
          if [[ "$entry" == "null" ]]; then
            echo "no configured repository matched: $TARGET_REPOSITORY" >&2
            exit 1
          fi
          {
            echo "name=$(jq -r '.name' <<< "$entry")"
            echo "slack_channel=$(jq -r '.slack_channel // ""' <<< "$entry")"
            echo "slack_user_mapping_json=$(jq -c '.slack_user_mapping // {}' <<< "$entry")"
            echo "large_repo=$(jq -r '.large_repo // false' <<< "$entry")"
            echo "labels_to_display_json=$(jq -c '.labels_to_display // []' <<< "$entry")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dashboard-token
        with:
          client-id: ${{ vars.PR_DASHBOARD_CLIENT_ID }}
          private-key: ${{ secrets.PR_DASHBOARD_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ steps.config.outputs.name }}
          permission-checks: read
          permission-contents: read
          permission-issues: write
          # Without members access the API reports org members as CONTRIBUTOR
          # instead of MEMBER, so routing fingerprints would never match the
          # ones recorded by update-dashboard.
          permission-members: read
          permission-pull-requests: write

      - name: Acquire repository publisher lock
        id: publisher-lock
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.config.outputs.name }}
        run: |
          state_branch="${DASHBOARD_STATE_BRANCH_PREFIX}/${REPO_NAME}"
          python3 "$DASHBOARD_CODE/state_branch.py" \
            acquire-publisher-lock \
            --state-branch "$state_branch" \
            --owner "$PUBLISHER_LOCK_OWNER"

      - name: Deliver dashboard updates
        id: delivery
        continue-on-error: true
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GH_TOKEN: ${{ steps.dashboard-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ steps.config.outputs.slack_channel }}
          SLACK_USER_MAP_JSON: ${{ steps.config.outputs.slack_user_mapping_json }}
          REPO_NAME: ${{ steps.config.outputs.name }}
          TRIGGER_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          state_branch="${DASHBOARD_STATE_BRANCH_PREFIX}/${REPO_NAME}"
          delivery_args=(
            --state-branch "$state_branch"
            --repo "$REPO_NAME"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "${TRIGGER_PR_NUMBER:-}" ]]; then
            delivery_args+=(--pr-number "$TRIGGER_PR_NUMBER")
          fi
          python3 "$DASHBOARD_CODE/delivery.py" "${delivery_args[@]}"

      - name: Publish dashboard issue
        if: >-
          always() &&
          steps.dashboard-token.outcome == 'success' &&
          steps.delivery.outputs.active == 'true'
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GH_TOKEN: ${{ steps.dashboard-token.outputs.token }}
          REPO_NAME: ${{ steps.config.outputs.name }}
          LARGE_REPO: ${{ steps.config.outputs.large_repo }}
          LABELS_TO_DISPLAY_JSON: ${{ steps.config.outputs.labels_to_display_json }}
        run: |
          set -euo pipefail
          state_branch="${DASHBOARD_STATE_BRANCH_PREFIX}/${REPO_NAME}"
          publish_args=(
            --state-branch "$state_branch"
            --repo "$REPO_NAME"
            --labels-to-display-json "$LABELS_TO_DISPLAY_JSON"
          )
          if [[ "${LARGE_REPO:-false}" == "true" ]]; then
            publish_args+=(--large-repo)
          fi
          python3 "$DASHBOARD_CODE/publish_dashboard.py" "${publish_args[@]}"

      - name: Release repository publisher lock
        if: always() && steps.publisher-lock.outcome == 'success'
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.config.outputs.name }}
        run: |
          state_branch="${DASHBOARD_STATE_BRANCH_PREFIX}/${REPO_NAME}"
          python3 "$DASHBOARD_CODE/state_branch.py" \
            release-publisher-lock \
            --state-branch "$state_branch" \
            --owner "$PUBLISHER_LOCK_OWNER"

      - name: Report GitHub App rate limits
        if: always() && steps.dashboard-token.outcome == 'success'
        continue-on-error: true
        env:
          DASHBOARD_CODE: ${{ steps.dashboard-code.outputs.path }}
          GH_TOKEN: ${{ steps.dashboard-token.outputs.token }}
        run: python3 "$DASHBOARD_CODE/report_rate_limits.py"

      - name: Check dashboard delivery
        if: always() && steps.delivery.outcome == 'failure'
        run: exit 1
